# Install this HTTP configuration before certificate issuance:
#   sudo ln -s /var/www/subby-virtual/deploy/nginx/subby.kdns.fr.conf /etc/nginx/sites-enabled/subby.kdns.fr
#   sudo nginx -t && sudo systemctl reload nginx
# Then run: sudo certbot --nginx -d subby.kdns.fr
# Certbot creates the HTTPS :443 server block and enables HTTP-to-HTTPS redirection.

server {
    listen 80;
    listen [::]:80;
    server_name subby.kdns.fr;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
    }
}
