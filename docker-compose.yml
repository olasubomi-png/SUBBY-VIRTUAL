services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: subby_virtual
      POSTGRES_USER: subby
      POSTGRES_PASSWORD: change-me-locally
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - subby_postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - subby_redis_data:/data

volumes:
  subby_postgres_data:
  subby_redis_data:
